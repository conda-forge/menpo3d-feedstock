{% set name = "menpo3d" %}
{% set version = "0.10.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 2afa594ca0800f2771891ddc87ca15bd1bfde23beb2e206b2b5eb7ab07fefe73

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}.*
    - pip
    - setuptools >=77
    - setuptools-scm >=8
  run:
    - python >={{ python_min }}
    - numpy >=1.23
    - scipy >=1.0
    - menpo >=0.12.1
    - moderngl >=5.6
    - opencv

test:
  imports:
    - menpo3d
    - menpo3d.io
    - menpo3d.rasterize
    - menpo3d.correspond
    - menpo3d.visualize
    - menpo3d.morphablemodel
  requires:
    - python {{ python_min }}.*
    - pip
  commands:
    - pip check

about:
  home: https://github.com/menpo/menpo3d
  dev_url: https://github.com/menpo/menpo3d
  doc_url: https://menpo3d.readthedocs.io/en/stable/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: The Menpo Project Python package for manipulating 3D meshes
  description: |
    A library inside the Menpo Project that makes manipulating 3D mesh data a
    simple task: importing, visualizing (with a moderngl viewer) and rasterizing
    3D meshes, correspondence, and 3D morphable models.

extra:
  recipe-maintainers:
    - patricksnape
